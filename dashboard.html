<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Honeypot AI Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #c9d1d9; font-family: monospace; padding: 20px; }
  h1 { color: #58a6ff; margin-bottom: 20px; }
  .cards { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; min-width: 150px; }
  .card h3 { font-size: 12px; color: #8b949e; margin-bottom: 8px; }
  .card .val { font-size: 28px; font-weight: bold; }
  .CRITICAL { color: #ff4444; }
  .HIGH     { color: #ff8800; }
  .MEDIUM   { color: #ffcc00; }
  .LOW      { color: #44ff88; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #21262d; font-size: 13px; }
  th { background: #161b22; color: #8b949e; }
  tr:hover { background: #161b22; }
  .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  .bg-CRITICAL { background: #3d1212; color: #ff4444; }
  .bg-HIGH     { background: #3d2212; color: #ff8800; }
  .bg-MEDIUM   { background: #3d3212; color: #ffcc00; }
  .bg-LOW      { background: #123d22; color: #44ff88; }
</style>
</head>
<body>
<h1>🛡 Honeypot AI Monitor</h1>
<div class="cards" id="cards">
  <div class="card"><h3>TOPLAM OLAY</h3><div class="val" id="total">—</div></div>
  <div class="card"><h3>CRITICAL</h3><div class="val CRITICAL" id="cnt-CRITICAL">0</div></div>
  <div class="card"><h3>HIGH</h3><div class="val HIGH" id="cnt-HIGH">0</div></div>
  <div class="card"><h3>MEDIUM</h3><div class="val MEDIUM" id="cnt-MEDIUM">0</div></div>
  <div class="card"><h3>LOW</h3><div class="val LOW" id="cnt-LOW">0</div></div>
</div>
<table>
  <thead><tr><th>Zaman</th><th>Saldırı Tipi</th><th>Sınıf</th><th>Şiddet</th><th>Güven</th><th>Adres</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>
<script>
async function refresh() {
  const [stats, threats] = await Promise.all([
    fetch('/api/stats').then(r => r.json()),
    fetch('/api/threats').then(r => r.json())
  ]);
  document.getElementById('total').textContent = stats.total;
  ['CRITICAL','HIGH','MEDIUM','LOW'].forEach(s => {
    document.getElementById('cnt-' + s).textContent = stats.by_severity[s] || 0;
  });
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = threats.map(t => {
    const r = t.report, e = t.event;
    const sev = r.severity;
    const time = t.timestamp.replace('T',' ').slice(0,19);
    return `<tr>
      <td>${time}</td>
      <td>${e.attackType}</td>
      <td>${r.attack_class}</td>
      <td><span class="badge bg-${sev}">${sev}</span></td>
      <td>%${r.confidence}</td>
      <td style="font-size:11px">${(e.actor||'').slice(0,18)}...</td>
    </tr>`;
  }).join('');
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
